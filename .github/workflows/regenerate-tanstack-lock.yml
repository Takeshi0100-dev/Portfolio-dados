name: Regenerate TanStack lockfile (test branch)

on:
  push:
    branches:
      - teste-efeito-vector-wordmark
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/regenerate-tanstack-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: teste-efeito-vector-wordmark
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit regenerated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Atualiza lockfile para corrigir vulnerabilidade TanStack"
            git push origin HEAD:teste-efeito-vector-wordmark
          else
            echo "package-lock.json já está atualizado."
          fi
